name: PR hygiene

# Uses pull_request (not pull_request_target) so the required `pr-title` check
# reports on every PR, including PRs that add or change this workflow.
# Same-repo PRs get a write token for labelling; fork PRs get read-only and the
# label jobs will no-op. No job checks out or executes PR code.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Required status check: name must stay exactly "pr-title".
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            ci
            build
            data
            revert
          requireScope: false

  labeler:
    name: labeler
    # Fork PRs get a read-only token; skip instead of failing on label writes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size:
    name: size
    # Fork PRs get a read-only token; skip instead of failing on label writes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = (pr.additions || 0) + (pr.deletions || 0);
            const buckets = [
              ['size/XS', 10], ['size/S', 50], ['size/M', 200], ['size/L', 800], ['size/XL', Infinity],
            ];
            const target = buckets.find(([, max]) => changed <= max)[0];
            const current = pr.labels.map((l) => l.name);
            const { owner, repo } = context.repo;
            for (const name of current.filter((n) => n.startsWith('size/') && n !== target)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch(() => {});
            }
            if (!current.includes(target)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [target] });
            }
            core.info(`${changed} lines changed -> ${target}`);

      - name: Type label from PR title
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const match = /^(\w+)(\([^)]*\))?!?:/.exec(pr.title || '');
            if (!match) { core.info('Title is not conventional; pr-title job reports this.'); return; }
            const map = {
              feat: 'type:feat', fix: 'type:fix', docs: 'type:docs', chore: 'type:chore',
              data: 'type:data', refactor: 'type:refactor', test: 'type:test',
              perf: 'type:refactor', ci: 'type:chore', build: 'type:chore', revert: 'type:fix',
            };
            const target = map[match[1]];
            if (!target) return;
            const { owner, repo } = context.repo;
            const current = pr.labels.map((l) => l.name);
            for (const name of current.filter((n) => n.startsWith('type:') && n !== target)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch(() => {});
            }
            if (!current.includes(target)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [target] });
            }
