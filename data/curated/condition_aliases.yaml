# Extra condition names used to map ClinicalTrials.gov `conditions` strings to slice diseases.
# The ClinicalTrials.gov connector first matches against the MONDO label and synonyms from
# Monarch; these aliases cover common registry spellings that are not MONDO synonyms.
# Matching is case-insensitive after normalisation (apostrophe-s, punctuation and Roman type
# numerals are normalised; "Gaucher Disease, Type III" == "gaucher disease type 3").
# A condition that matches nothing is reported as unmapped; it is never guessed.
# Schema and rules: data/curated/README.md

aliases:
  - name: Parkinson disease
    disease_id: MONDO:0008199
    url: https://monarchinitiative.org/MONDO:0008199
    retrieved: 2026-10-04
    curator: claude-agent, needs human check
    notes: >-
      Slice convention. Registry records say "Parkinson Disease" without the GBA1 status;
      the slice's Parkinson node is late-onset Parkinson disease (OMIM 168600, the GBA1
      susceptibility entry). Edges made through this alias carry condition_match=alias and a
      lower confidence.
  - name: Parkinsons disease
