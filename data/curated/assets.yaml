# Curated reusable assets (trials, registries, biomarkers, publications) for the gba1 slice.
# Schema and rules: data/curated/README.md
# Trial fields are copied from ClinicalTrials.gov API v2 on the retrieved date. They describe
# registry records only and make no efficacy or dosing recommendation.

assets:
  - id: aspro-pd
    name: ASPro-PD - Ambroxol to Slow Progression in Parkinson Disease
    type: interventional_trial
    url: https://clinicaltrials.gov/study/NCT05778617
    source_record_id: NCT05778617
    disease_ids: [MONDO:0008199]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    attributes: {phase: "3", status: RECRUITING, enrollment_estimated: 330, sponsor: University College London, primary_completion: 2029-02}
    notes: >-
      UK only. PD within 7 years, age 35-75, GBA1 status known (positive or negative).
      Ambroxol titrated to 1260 mg/day vs placebo for 104 weeks; primary endpoint MDS-UPDRS I-III.
      Reusable for nGD: safety data, GBA1 stratification, biomarker protocols.

  - id: ambroxol-iir-registry
    name: Registry of real-world data on ambroxol for Gaucher disease or GBA carriers with PD
    type: observational_registry
    url: https://clinicaltrials.gov/study/NCT04388969
    source_record_id: NCT04388969
    disease_ids: [MONDO:0018150, MONDO:0008199]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    attributes: {status: RECRUITING, enrollment_estimated: 300, sponsor: Shaare Zedek Medical Center, completion: 2030-11-30}
    notes: Already spans both communities - the strongest existing bridge asset.

  - id: provide-pr001-gd2
    name: PROVIDE - PR001 (LY3884961) gene therapy in infants with type 2 Gaucher disease
    type: interventional_trial
    url: https://clinicaltrials.gov/study/NCT04411654
    source_record_id: NCT04411654
    disease_ids: [MONDO:0009266]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    attributes: {phase: "1/2", status: ACTIVE_NOT_RECRUITING, enrollment_actual: 7, sponsor: Prevail Therapeutics}
    notes: Same product as PROPEL (NCT04127578) in GBA1-PD.

  - id: propel-pr001-gba-pd
    name: PROPEL - PR001 (LY3884961) in PD with at least one GBA1 variant
    type: interventional_trial
    url: https://clinicaltrials.gov/study/NCT04127578
    source_record_id: NCT04127578
    disease_ids: [MONDO:0008199]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    attributes: {phase: "1/2", status: ACTIVE_NOT_RECRUITING, enrollment_estimated: 32, sponsor: Prevail Therapeutics}
    notes: Same product as PROVIDE (NCT04411654) in Gaucher type 2.

  - id: leap2mono-venglustat-gd3
    name: LEAP2MONO - venglustat vs imiglucerase in Gaucher disease type 3
    type: interventional_trial
    url: https://clinicaltrials.gov/study/NCT05222906
    source_record_id: NCT05222906
    disease_ids: [MONDO:0009267]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    attributes: {phase: "3", status: ACTIVE_NOT_RECRUITING, enrollment_actual: 43, sponsor: Sanofi}
    notes: >-
      Sanofi press release 2026-02-02 reports both primary endpoints met (SARA modified, RBANS
      at week 52 vs ERT): https://www.sanofi.com/en/media-room/press-releases/2026/2026-02-02-06-00-00-3229947
      Counterexample pair with MOVES-PD. FDA target action date 2026-11-25 reported in press
      coverage [U on fda.gov].

  - id: moves-pd-venglustat
    name: MOVES-PD - venglustat in PD with a GBA mutation
    type: interventional_trial
    url: https://clinicaltrials.gov/study/NCT02906020
    source_record_id: NCT02906020
    disease_ids: [MONDO:0008199]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    attributes: {phase: "2", status: TERMINATED, enrollment_actual: 273, sponsor: Genzyme, has_results: true}
    notes: >-
      whyStopped - did not meet the primary or secondary endpoints. Giladi et al. Lancet Neurol
      2023, PMID 37479372: no beneficial effect vs placebo. Counterexample to "shared mechanism
      means shared therapy".

