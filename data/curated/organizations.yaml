    name: National Gaucher Foundation
    type: patient_org
    url: https://www.gaucherdisease.org
    disease_ids: [MONDO:0018150, MONDO:0009265, MONDO:0009266, MONDO:0009267]
    retrieved: 2026-10-03
    verified: url resolves (HTTP 200); scope page not read
    curator: claude-agent, needs human check
