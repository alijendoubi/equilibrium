# Render Blueprint for the Equilibrium Atlas API.
# In Render: New + -> Blueprint -> select alijendoubi/equilibrium. Render builds the backend
# Docker image from the repo root (the snapshot in data/snapshot is copied into the image)
# and redeploys on every push to main. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: equilibrium-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    # Starter avoids the roughly 50-second cold start of the free plan.
    plan: starter
    branch: main
    # Keep the proven Blueprint deploy path until Actions and the hook are verified (#25).
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        # Set to the Vercel production URL, e.g. https://equilibrium-atlas.vercel.app
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Public /explain serves the committed cache, then the template. Set to "1" only if
      # live OpenAI calls from visitors are wanted (rate limited per IP).
      - key: EXPLAIN_LIVE
        value: "0"
      - key: EXPLAIN_RATE_PER_MINUTE
        value: "10"
