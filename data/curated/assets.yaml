  - id: narita-2016-ambroxol-ngd-pilot
    name: Ambroxol chaperone therapy for neuronopathic Gaucher disease - a pilot study (Narita et al. 2016)
    type: publication_clinical_evidence
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4774255/
    source_record_id: PMID:27042680
    disease_ids: [MONDO:0009266, MONDO:0009267]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    notes: >-
      Open-label, 5 patients, ambroxol with ERT, target 25 mg/kg/day (max 1300 mg/day).
      Reported BBB penetration, higher lymphocyte GCase, lower CSF glucosylsphingosine.
      Pilot evidence only, not treatment guidance.

  - id: biomarker-lyso-gb1
    name: Glucosylsphingosine (lyso-Gb1)
    type: biomarker
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9966520/
    source_record_id: PMID:36835356
    disease_ids: [MONDO:0018150, MONDO:0009266, MONDO:0009267]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    notes: >-
      Review of lyso-Gb1 in Gaucher treatment decisions (Int J Mol Sci 2023). CSF lyso-Gb1 was
      a pharmacodynamic readout in Narita 2016; a candidate shared biomarker with GBA1-PD
      studies [hypothesis - check whether ASPro-PD measures it, U].

  - id: sapc-eliglustat-case
    name: Repurposing Gaucher disease therapy for saposin C deficiency - eliglustat case
    type: publication_case_report
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13220302/
    source_record_id: PMID:41812503
    disease_ids: [MONDO:0012517]
    retrieved: 2026-10-03
    curator: claude-agent, needs human check
    notes: >-
      Single patient, 9 years of eliglustat: systemic improvement, no seizure improvement.
      States no specific therapy is approved for saposin C deficiency. The only weak lead on the
      honest-gap card.
