# Mechanism whitelist for the gba1 slice: GO biological-process terms that tell the
# GBA1/GCase-lysosomal story. Schema and rules: data/curated/README.md
# Ids, names and definitions were checked against the QuickGO ontology API
# (https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/<ids>) on the retrieved date.
# A seed gene gets a `participates_in` edge to a term when one of its GO BP annotations
# (via Monarch) is the term itself or a descendant of it.

