name: Deploy

# Every deploy job checks its secrets first and SKIPS (with a notice) when they
# are missing. A missing secret must never turn a run red.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-preview:
    name: frontend-preview (vercel)
    # Same-repo PRs only: fork PRs never receive secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check Vercel secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel preview skipped::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not configured."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Vercel CLI
        if: steps.secrets.outputs.ok == 'true'
        run: npm install --global vercel@62.2.0

      - name: Pull Vercel env (preview)
        if: steps.secrets.outputs.ok == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy (preview)
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: steps.secrets.outputs.ok == 'true' && steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vercel-preview
          message: |
            **Frontend preview:** ${{ steps.deploy.outputs.url }}

            Commit `${{ github.event.pull_request.head.sha }}`

  frontend-production:
    name: frontend-production (vercel)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check Vercel secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel production skipped::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not configured."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Vercel CLI
        if: steps.secrets.outputs.ok == 'true'
        run: npm install --global vercel@62.2.0

      - name: Pull Vercel env (production)
        if: steps.secrets.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy (production)
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

  backend-production:
    name: backend-production (render)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check Render secret
        id: secrets
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Render deploy skipped::RENDER_DEPLOY_HOOK_URL not configured."
          fi

      - name: Trigger Render deploy hook
        if: steps.secrets.outputs.ok == 'true'
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered." >> "$GITHUB_STEP_SUMMARY"
