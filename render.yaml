# Render Blueprint for the Equilibrium Atlas API.
# In Render: New + -> Blueprint -> select alijendoubi/equilibrium. Render builds the backend
# Docker image from the repo root (the snapshot in data/snapshot is copied into the image)
# and is triggered by the GitHub deploy hook after a push to main. Secrets are entered in the
# dashboard (sync: false).
services:
  - type: web
    name: equilibrium-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    # The free plan sleeps when idle (about 50 s cold start). Use starter during judging.
    plan: starter
    branch: main
    # deploy.yml owns main deployments through RENDER_DEPLOY_HOOK_URL. Keeping Blueprint
    # auto-deploy off avoids two concurrent deploys for one commit.
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        # Set to the Vercel production URL, e.g. https://equilibrium-atlas.vercel.app
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Public /explain serves the committed cache, then the template. Set to "1" only if
      # live OpenAI calls from visitors are wanted (rate limited per IP).
      - key: EXPLAIN_LIVE
        value: "0"
      - key: EXPLAIN_RATE_PER_MINUTE
        value: "10"
