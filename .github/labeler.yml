# actions/labeler v5 format
area:backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/**'

area:frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**'

area:data:
  - changed-files:
      - any-glob-to-any-file:
          - 'data/**'
          - 'backend/src/atlas/ingest/**'
          - 'docs/DATA_SOURCES.md'

area:infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '**/Dockerfile'
          - '**/.dockerignore'
          - 'docker-compose*.yml'
          - 'Makefile'
          - 'scripts/**'
          - '.pre-commit-config.yaml'

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
